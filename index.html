<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>Gioco dell’Impostore</title>

  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" href="./favicon.png?v=1" type="image/png">
</head>
<body>
  <header class="topbar">
    <button id="themeToggle" class="icon-btn" aria-label="Tema" title="Tema">
      <span id="themeIcon" aria-hidden="true">🌙</span>
    </button>

    <h1 class="title">Gioco dell’impostore</h1>

    <button id="musicToggle" class="icon-btn" aria-label="Musica" title="Musica">
      <span id="musicIcon" aria-hidden="true">🔇</span>
    </button>
  </header>

  <main class="stage">
    <section class="card" aria-live="polite">
      <div id="cardContent"></div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
